services:
  postgres:
    image: postgres:16-alpine
    container_name: dev_test_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtest
      POSTGRES_PASSWORD: devtest
      POSTGRES_DB: devtest
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtest -d devtest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
